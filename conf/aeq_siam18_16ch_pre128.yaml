# =============================================================================
# STAGE 1 of 2: cheap 128^3 pre-train for the AEQ MeshNet.
#
# Inherits everything from aeq_siam18_16ch.yaml and changes only the curriculum
# stage: cubes 128 instead of 256 for 16 epochs. A 128 cube is 8x fewer voxels,
# and the ternary [1,3,9,27] micro-stack needs ~2 sweeps to span 128 vs ~4 for
# 256, so a step is roughly 10-16x cheaper -- the whole A/B/C/D phase ladder
# (15 epochs) costs about what 1-2 epochs of 256 cost.
#
# Why this is well-founded rather than just cheap: resolution transfer is a
# DESIGNED property here (design doc ablation 6). y carries no spatial extent
# (g reads z only through a global pool) and the infinity-norm row-sum bound is
# shape-independent, so the contraction guarantee that makes the solver work at
# 128 holds unchanged at 256. Nothing about the fixed point is resolution-bound.
# Running the phase ladder cheaply also means solver failures (non-convergence,
# a failing random-mask gate) surface in minutes instead of hours.
#
# Run:
#   srun ... python curriculum_training_aeq.py --config-dir=conf \
#        --config-name=aeq_siam18_16ch_pre128
#
# Then STAGE 2 at 256, resuming these weights and entering directly at phase D
# (offset 15 skips the A/B/C ladder, which stage 1 already completed):
#   srun ... python curriculum_training_aeq.py --config-dir=conf \
#        --config-name=aeq_siam18_16ch \
#        paths.loadcheckpoint=true \
#        paths.model=/data/users4/splis/data/segmentation/aeq18_pre128/model.last.pth \
#        model.aeq.phases.epoch_offset=15
#
# NOTE the 27-dilated layer pads 27 voxels on a 128 cube, so its outer taps see
# some padding. That is real but mild (per-sweep RF 81 < 128, and the d=1/3/9
# stages are unaffected); it is the same tradeoff the existing curriculum makes
# when it starts at 128 with the hdc_deep 31-dilated trunk.
# =============================================================================

defaults:
  - aeq_siam18_16ch
  - _self_

wandb:
  run_tag: "aeq_16ch_pre128"

paths:
  loadcheckpoint: false
  model: ""
  logdir: "/data/users4/splis/data/segmentation/aeq18_pre128/"

experiment:
  # Same peak LR as stage 2. Single rep, so no 0.8^rep attenuation applies.
  lr_scale: 0.05
  # A 128 step is much cheaper, so accumulate less: the point of this stage is
  # many fast steps through the phase ladder, not maximal gradient quality.
  accum_steps: 2
  maxreps: 1
  cubesizes_code: |
    [128] * maxreps
  epochs_code: |
    [16] * maxreps    # A:0-4  B:5-9  C:10-14  D:15  (ladder fully exercised,
                      # incl. one epoch of site gating behind the async gate)
