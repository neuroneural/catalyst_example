# MeshNet with Squeeze-and-Excitation channel attention.
# SE blocks add channel-wise gating after each Conv+BN+ReLU layer.
# Parameters live in Linear layers on [B, hidden] vectors — zero
# additional spatial activation memory vs. base MeshNet.
# Ref: Hu et al., "Squeeze-and-Excitation Networks", CVPR 2018.
mongo:
  host: "10.245.12.58"
  host_slurm: "arctrdcn018.rs.gsu.edu"
  dbname: "MindfulTensors"
  collection: "MRN"
  index_id: "id"
  labelfield: "label3"
  datafield: "T1"
  validation_percent: 0.1

wandb:
  team: "neuroneural"
  project: "synthGWM_5"

bit16: True

model:
  n_classes: 3
  model_channels: 5
  model_label: "_se_h64_L3"
  config_file: "./modelAE.json"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  use_groupnorm: False
  use_me: False
  use_se: True
  se:
    se_hidden_channels: 64    # width of excitation MLP (>> C=5 for real capacity)
    se_num_fc_layers: 3       # depth: in→hidden→hidden→out→σ
  loss_weight: [0, 1]
  use_refiner: False

paths:
  loadcheckpoint: False
  model: "./logs/tmp/synth3_se_h64_L3/model.last.pth"
  logdir: "./logs/tmp/synth3_se_h64_L3/"

client_creator:
  crop_tensor: False

experiment:
  lr_scale: 0.0001
  maxreps: 10
  cubesizes_code: |
    [192] + [256] * (maxreps - 1)
  numcubes_code: |
    [1] * maxreps
  numvolumes_code: |
    [1] * maxreps
  weights_code: |
    [1] * maxreps
  databases_code: |
    ["MindfulTensors"] * maxreps
  collections_code: |
    ["MRN"] * maxreps
  dbfields_code: |
    [("T1", "label3")] * maxreps
  epochs_code: |
    [2] + [5] * (maxreps-3) + [50, 100]
  prefetches_code: |
    [24] * maxreps
  attenuates_code: |
    [0.8] * maxreps
