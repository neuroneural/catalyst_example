# an experiment with only 3 layers in meshnet 16,1,16
mongo:
  host: "10.245.12.58" # "arctrdcn018.rs.gsu.edu"
  host_slurm: "arctrdcn018.rs.gsu.edu"
  dbname: "MindfulTensors"
  collection: "MRN"
  index_id: "id"
  labelfield: "label3"
  datafield: "T1"
  validation_percent: 0.1

wandb:
  team: "neuroneural"
  project: "synthGWM_5"

bit16: True

model:
  n_classes: 3
  model_channels: 5
  model_label: "_r"
  config_file: "./modelAE.json"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  use_groupnorm: False
  use_me: False
  loss_weight: [0, 1]
  use_refiner: True
  refiner_delta_lambda: 3e-3
  refiner_delta_target: 0.15
  refiner_freeze_epochs_after_transition: 1
  refiner_bypass_prob: 0.0
  refiner_base_loss_lambda: 0.15
  refiner:
    refiner_max_iter: 30
    refiner_tol: 5e-5
    refiner_anderson_m: 5
    refiner_backward_mode: "implicit"
    refiner_backward_max_iter: 30
    refiner_backward_tol: 5e-5
    refiner_backward_anderson_m: 5


paths:
  loadcheckpoint: False
  model: "./logs/tmp/synth3_refiner5/model.last.pth"
  logdir: "./logs/tmp/synth3_refiner5/"

client_creator:
  crop_tensor: False

experiment:
  lr_scale: 0.0001
  maxreps: 10
  cubesizes_code: |
    [192] + [256] * (maxreps - 1)
  numcubes_code: |
    [1] * maxreps
  numvolumes_code: |
    [1] * maxreps
  weights_code: |
    [1] * maxreps
  databases_code: |
    ["MindfulTensors"] * maxreps
  collections_code: |
    ["MRN"] * maxreps
  dbfields_code: |
    [("T1", "label3")] * maxreps
  epochs_code: |
    [2] + [5] * (maxreps-3) + [50, 100]
  refiner_blends_code: |
    [0.25] + [0.5] * (maxreps - 1)
  prefetches_code: |
    [24] * maxreps
  attenuates_code: |
    [0.8] * maxreps
