# =============================================================================
# Adaptive Equilibrium MeshNet (Variant M of adaptive_equilibrium_design_v2.md)
# 18-class synth labels, 16 channels, trained FROM SCRATCH.
#
# Run:  python curriculum_training_aeq.py \
#           --config-dir=conf --config-name=aeq_siam18_16ch
#
# What trains: a weight-tied dilated conv micro-stack (inner contour z) coupled
# to a 64-dim outer state y that multiplicatively gates it, solved to a joint
# fixed point with safeguarded Anderson; gradients via RBP (implicit diff).
# Warm-up phases (Sec. 7.1) are driven by model.aeq.phases below.
#
# Expect 4-8x wall-clock per step vs the explicit gn_hdc_deep model at equal
# resolution (forward ~10 sweeps x len(dilations) convs; backward ~K_b VJPs).
# Peak training memory: z (16ch fp32 @256^3 ~= 1.07GB) + 2*window_m Anderson
# history tensors (bf16 ~= 3.2GB) + one f-evaluation tape for the backward.
# =============================================================================

mongo:
  # SynthSeg generator served via wirehead (same endpoints as the siam18 runs).
  host: "10.245.12.58"
  host_slurm: "10.245.12.58"
  dbname: "synth104"
  collection: "read"
  index_id: "id"
  labelfield: "label"
  datafield: "data"
  validation_percent: 0.1

wandb:
  team: "neuroneural"
  project: "synth18"
  run_tag: "aeq_16ch_mult"

bit16: True

perf:
  verbose: False
  cudnn_benchmark: True
  tf32: True
  channels_last: False   # eager GN has no NHWC 3D kernel; compile is off (below)
  compile: False         # Dynamo cannot trace the solver loop / custom Function
  ddp_batch_sync: True
  profile: False
  profile_steps: 10
  amp_dtype: "bfloat16"  # bf16 autocast for the forward solve; backward VJPs
                         # run fp32 unless model.aeq.backward.bwd_amp=true

model:
  n_classes: 18
  model_channels: 16
  model_label: "_aeq_16"
  # Kept for hparams logging / resume plumbing only; the AEQ trunk is built
  # from model.aeq.dilations, not from this json.
  config_file: "./modelAE_hdc_deep.json"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  use_groupnorm: True
  use_affine: True
  use_me: False
  use_se: False
  use_checkpoint: False
  loss_weight: [1.0, 0.0]     # CE only to start; add Dice/clDice arms later
  label_smoothing: 0.0
  dice_generalized: True
  loss_fused: True
  use_refiner: False
  use_ema: False
  ema_decay: 0.999

  # --------------------------------------------------------------------------
  # Adaptive Equilibrium block (see AEQ_GUIDE.md and the design doc sections
  # referenced next to each knob).
  # --------------------------------------------------------------------------
  aeq:
    enabled: true
    C_y: 64                    # outer state size (Sec. 2)
    coupling: mult             # mult | add | none  (the Sec. 8.2 headline arms)
    gate_position: post_norm   # post_norm (default; gate survives GN)
                               # pre_norm  (doc-literal Sec. 3.4, for ablation)
    m_max: 0.9
    alpha_outer: 0.5
    # Weight-tied micro-stack applied every sweep. Ternary [1,3,9,27]: each
    # stage exactly tiles the previous footprint, so the per-sweep RF (81) is
    # dense with NO gridding holes at any sweep -- the modelAE_hdc_deep
    # coprime-ramp doctrine applied to the per-sweep set (iteration supplies
    # depth/reach: 4 sweeps cover 256^3; the ramp's symmetry emerges free from
    # composing the same set). Doc-literal M-A is dilations: [4] (~32 sweeps
    # to cover -- the MDEQ RF bound). To iterate the existing explicit
    # schedule as the equilibrium map (design ablation 8):
    #   dilations: [1, 3, 5, 7, 13, 19, 31, 19, 13, 7, 5, 3, 1]
    # (full RF in sweep 1; ~13 convs/sweep, so drop solver.max_iter to ~6).
    dilations: [1, 3, 9, 27]
    n_groups: 8

    solver:                    # Sec. 5.2 safeguarded Anderson
      window_m: 3
      beta: 0.8
      lambda_ridge: 1.0e-4
      eps: 1.0e-3
      max_iter: 12
      eval_max_iter: 16        # validation/inference budget
      history_dtype: bfloat16
      # torch.compile the step f ONLY inside the no_grad solve (the RBP
      # backward keeps its own eager evaluation of H, so implicit diff is
      # untouched). Fuses conv->GN->gate->act; the main GPU-utilization
      # lever. One recompile fires at the B->C activation switch. Set false
      # to A/B or if the cluster torch chokes (a call-time failure also
      # auto-falls back to eager permanently).
      compile_step: true

    backward:                  # Sec. 6 RBP with block-wise stopping
      max_iter: 32
      eps: 1.0e-4
      bwd_amp: false           # true = bf16 VJPs (faster, slightly noisier)

    site_gating:               # Sec. 5.3 -- phase D only, gate-checked first
      enabled: true
      tau_0: 5.0e-4            # 0.5 * eps_f
      learned_threshold: true  # tau = tau_0 * exp(-Linear(y))

    outer:
      read_residual: false     # closed-loop adaptivity; flip on at Milestone 2
      outer_grad: implicit     # implicit | detached_bptt (with read_residual)

    stability:                 # Sec. 7.2 infinity-norm control
      rowsum_target: 0.7       # composed product cap across the micro-stack
      rowsum_target_y: 0.9     # cap on g's output Linear
      include_gn_gamma: true
      async_gate_every: 50     # random-freeze-mask check cadence (steps)
      async_gate_mask_frac: 0.5

    loss:                      # Sec. 7.3
      lambda_aux: 0.1          # aux head on y* -> per-class volume fractions
      gamma_jac: 0.1           # Hutchinson ||F_z||_F^2, 1 probe
      # lambda_ponder intentionally not implemented (Phase 3; collapse hazard)

    phases:                    # Sec. 7.1 warm-up (epoch boundaries, 0-based)
      unroll_epochs: 5         # A: [0,5)  unrolled K=5, softplus, no gating
      unroll_K: 5
      softplus_epochs: 10      # B: [5,10) solver+RBP, softplus
      gating_epoch: 15         # C: [10,15) ELU; D: [15,...) + site gating
      # Added to the local epoch index. Each curriculum rep builds a fresh
      # runner whose epoch count restarts at 0, which would drag a
      # warm-started model back to phase A (unrolled + softplus). Set this
      # on a RESUMED stage so it enters at the right phase -- e.g. after the
      # 128 pre-train (aeq_siam18_16ch_pre128.yaml) completed A/B/C, run
      # this config with model.aeq.phases.epoch_offset=15 to start in D.
      epoch_offset: 0

paths:
  loadcheckpoint: false
  model: ""
  logdir: "/data/users4/splis/data/segmentation/aeq18_16ch/"

client_creator:
  crop_tensor: False

dataloader:
  num_workers: 12
  prefetch_factor: 4
  valid_prefetch_factor: 2
  persistent_workers: true    # launch with MALLOC_TRIM_THRESHOLD_=0 MALLOC_ARENA_MAX=2

metrics:
  dice_every_n_steps: 10
  dice_subsample_stride: 4

validation:
  db: "MindfulTensors"
  collection: "MRN"
  datafield: "T1"
  labelfield: "labelfused"
  num_subjects: 64
  surface_metrics: true
  surface_every_n_epochs: 5
  nsd_tau: 1.0
  spacing: [1.0, 1.0, 1.0]
  fail_dice: 0.5

experiment:
  # max_lr = 8 * lr_scale / 256. DEQs want a cooler peak than the explicit
  # model: implicit gradients are exact but the loss surface of a weight-tied
  # map is stiffer. 0.05 -> ~1.6e-3 peak. Raise only after phase B is stable.
  lr_scale: 0.05
  weight_decay: 1.0e-4        # design Sec. 7.4 (auto-switches Adam -> AdamW)
  grad_clip: 1.0
  pct_start: 0.05
  accum_steps: 4              # AEQ steps are pricey; effective batch 4/GPU
  maxreps: 1
  cubesizes_code: |
    [256] * maxreps
  numcubes_code: |
    [1] * maxreps
  numvolumes_code: |
    [1] * maxreps
  weights_code: |
    [1] * maxreps
  databases_code: |
    ["wirehead_mrn_gentle"] * maxreps
  collections_code: |
    ["read"] * maxreps
  dbfields_code: |
    [("data", "label")] * maxreps
  epochs_code: |
    [100] * maxreps           # A/B/C are epochs 0-14; D (gated) is 15+
  prefetches_code: |
    [24] * maxreps
  attenuates_code: |
    [0.8] * maxreps
