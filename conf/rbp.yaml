mongo:
  host: "10.245.12.58"
  host_slurm: "arctrdcn018.rs.gsu.edu"
  dbname: "MindfulTensors"
  collection: "MRN"
  index_id: "id"
  labelfield: "label3"
  datafield: "T1"
  validation_percent: 0.1

wandb:
  team: "neuroneural"
  project: "synthGWM_5"

bit16: True

model:
  n_classes: 3
  model_channels: 5
  model_label: "_rbp"
  config_file: "./modelAE.json"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  use_groupnorm: False
  use_me: False
  loss_weight: [1, 0]
  use_refiner: True
  refiner_delta_lambda: 0.0
  refiner_delta_target: 1.0
  refiner_freeze_epochs_after_transition: 0
  refiner_bypass_prob: 0.0
  refiner_base_loss_lambda: 0.0
  refiner:
    rbp_max_iter: 30
    rbp_tol: 1e-4
    rbp_anderson_m: 5
    rbp_backward_max_iter: 30
    rbp_backward_tol: 1e-4
    rbp_backward_anderson_m: 0
    rbp_relax: 0.2

paths:
  loadcheckpoint: False
  model: "./logs/tmp/synth3_rbp/model.last.pth"
  logdir: "./logs/tmp/synth3_rbp/"

client_creator:
  crop_tensor: False

experiment:
  lr_scale: 0.0001
  maxreps: 10
  cubesizes_code: |
    [192] + [256] * (maxreps - 1)
  numcubes_code: |
    [1] * maxreps
  numvolumes_code: |
    [1] * maxreps
  weights_code: |
    [1] * maxreps
  databases_code: |
    ["MindfulTensors"] * maxreps
  collections_code: |
    ["MRN"] * maxreps
  dbfields_code: |
    [("T1", "label3")] * maxreps
  epochs_code: |
    [2] + [5] * (maxreps-3) + [50, 100]
  refiner_blends_code: |
    [1.0] * maxreps
  prefetches_code: |
    [24] * maxreps
  attenuates_code: |
    [0.8] * maxreps
