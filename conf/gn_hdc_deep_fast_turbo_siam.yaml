# =============================================================================
# gn_hdc_deep_fast.yaml + convergence-speed deltas (the model is capable; this
# just helps it train faster/cleaner). Run:
#   python curriculum_training_fast.py --config-name gn_hdc_deep_fast_turbo_siam
#
# Deltas vs gn_hdc_deep_fast.yaml (everything else identical):
#   1. accum_steps: 8          -> effective batch 8 at ZERO extra peak memory.
#                                 Smooths the very noisy single-256^3-volume
#                                 gradient; lets the LR run hotter/cleaner.
#   2. perf.amp_dtype: bfloat16-> drop GradScaler over/underflow stalls; more
#                                 stable for the tiny-channel GroupNorm grads.
#   3. Single long LR cycle    -> maxreps=1, epochs=[150]. The fast config's
#                                 10-rep "curriculum" was all cube 256 / 1 vol,
#                                 i.e. pure OneCycle LR thrash with 0.8^rep peak
#                                 attenuation. One long warmup+anneal at a tuned
#                                 max_lr spends the whole budget climbing.
#   4. use_ema: 0.999          -> validate + checkpoint on EMA weights; raises
#                                 and smooths the effective curve, free at infer.
#   5. weight_decay: 1e-2      -> Adam->AdamW, conv weights only (GroupNorm +
#                                 biases excluded); keeps conv-weight/activation
#                                 magnitudes fp16-safe for the WebGPU export.
#   6. grad_clip: 1.0          -> bounds an oversized-gradient batch so it can't
#                                 knock training into the transient train-dice
#                                 collapses seen on siam3 (non-finite norm skips
#                                 the step entirely).
#   7. dataloader.persistent_workers: true -> long-lived Mongo/dataloader workers,
#                                 no per-epoch respawn+reconnect pause. REQUIRES
#                                 the glibc allocator tamed at process launch (see
#                                 the dataloader: block below) or host RAM leaks
#                                 across the run and SLURM will OOM-kill you.
#   8. real_eval block         -> periodic real-data (MindfulTensors/MRN) Dice /
#                                 NSD / HD95 / ASSD eval every N epochs:
#                                 DDP-sharded GPU inference on the live model,
#                                 then the CPU distance transforms in a detached
#                                 nice'd process pool that overlaps the next
#                                 epoch (real_eval_ddp.py / real_eval_reduce.py).
#                                 Off by default.
# (2026-08: 5-8 were previously missing here even though 1-4 were documented in
#  this header -- 1 and 4 were themselves not actually applied in the body. All
#  now match gn_hdc_deep_fast_turbo_siam18.yaml's tuning + the header's intent.)
#
# NOTE: keeps gn_hdc_deep_fast's data (MindfulTensors/MRN/label104). If your
# improving run is the synth18 "read" collection, switch the mongo + experiment
# db/collection/labelfield to synth18 / read / label18 (see gn_hdc_deep_sae.yaml).

mongo:
  # SynthSeg generator served via wirehead -> db "synth18", collection "read".
  # (Pointing at MindfulTensors/MRN returns empty records -> mytransform "0 bytes".)
  host: "10.245.12.58"
  host_slurm: "10.245.12.58"   # wirehead/synth18 endpoint; verify if running under SLURM
  dbname: "synth104"
  collection: "read"
  index_id: "id"
  labelfield: "label"
  datafield: "data"
  validation_percent: 0.1

wandb:
  team: "neuroneural"
  project: "synth104"

bit16: True

perf:
  verbose: False
  cudnn_benchmark: True
  tf32: True
  channels_last: True     # ON: GN is a fused triton kernel once compile works, so
                          # NHWC no longer thrashes the norm and bf16 convs run
                          # NHWC on the tensor cores (~8% faster). Under multi-GPU
                          # DDP this yaml value only sets the launcher; the spawned
                          # ranks read FastRunner's class default (True) / the
                          # FAST_CHANNELS_LAST env var instead -- already True, so
                          # no action needed, just don't set FAST_CHANNELS_LAST=0.
  compile: True
  compile_mode: "default"   # reduce-overhead gave 0 speedup (util already ~100%).
                             # To try inductor conv-algo autotune: FAST_COMPILE_MODE=max-autotune
  ddp_batch_sync: True
  profile: False                 # one-shot torch.profiler. Enable per-run for DDP with
  profile_steps: 10              # FAST_PROFILE=1 (yaml value doesn't reach mp.spawn ranks).
  amp_dtype: "bfloat16"          # "float16" (old default) | "bfloat16"

model:
  n_classes: 104
  model_channels: 24
  model_label: "_gn_hdc_deep_24"
  config_file: "./modelAE_hdc_deep.json"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  use_groupnorm: True
  use_affine: True
  use_me: False
  use_se: False
  # False hard-OOMs on this 24ch/13-layer/104-class model at 256^3 (full
  # activations retained for backward) -- keep True + checkpoint_segments.
  use_checkpoint: True
  checkpoint_segments: 2
  checkpoint_keep_layers: 0
  loss_weight: [0.5, 0.5]
  label_smoothing: 0.01
  dice_generalized: True
  loss_fused: True
  use_refiner: False
  # EMA swaps in averaged weights for VALIDATION + the checkpoint save only; it
  # never touches the macro_dice_batch/train curve (training always uses raw
  # weights). Judge it on macro_dice/valid, not train. Free at inference (no
  # extra params/compute -- just which weights get exported).
  use_ema: True
  ema_decay: 0.999

paths:
  loadcheckpoint: True
  # WARM START INTO A NEW DIRECTORY: `model` and `logdir` deliberately DIFFER.
  # It loads the previous good checkpoint and writes everything new under
  # infant104_..., so synth104_..._fromreal_fused is never overwritten and
  # stays available to fall back to or to diff against.
  #
  # Consequence: this is no longer self-resuming. If this job is killed and
  # resubmitted it will rewind to the ORIGINAL warm-start rather than picking up
  # where it stopped -- because `model` still points at the old directory. To
  # continue an interrupted run instead of restarting it, repoint `model` at
  # ./logs/tmp/infant104_gn_hdc_deep_turbo24/model.last.pth. (With --time now at
  # the 5-day cluster max, a 40-epoch run should not be hitting the wall clock.)
  #
  # A first launch finds no checkpoint under logdir, which is fine: Catalyst's
  # resume reads `model`, not logdir.
  model: "./logs/tmp/synth104_gn_hdc_deep_turbo24_fromreal_fused/model.last.pth"
  logdir: "./logs/tmp/infant104_gn_hdc_deep_turbo24/"

client_creator:
  crop_tensor: False

dataloader:
  num_workers: 12
  prefetch_factor: 4
  valid_prefetch_factor: 2
  # true = long-lived workers (no per-epoch respawn + Mongo reconnect pause).
  # REQUIRES taming the glibc allocator or the workers' malloc arenas creep and
  # leak host RAM across the run (documented OOM-kill at ~epoch 27 without
  # this). Launch with:
  #   MALLOC_TRIM_THRESHOLD_=0 MALLOC_ARENA_MAX=2 python curriculum_training_fast.py ...
  # (or LD_PRELOAD a jemalloc/tcmalloc). If your launch script can't guarantee
  # those env vars are set BEFORE the python process starts, set this back to
  # false rather than risk a mid-run OOM-kill.
  persistent_workers: true

metrics:
  dice_every_n_steps: 10
  dice_subsample_stride: 4

# Periodic real-data (MindfulTensors/MRN) boundary-metric eval -- Dice, Surface
# Dice (NSD), HD95, ASSD, per-structure + worst-case tail -- run every
# `every_n_epochs` epochs instead of every epoch (too expensive at 256^3).
#
# Two phases (see real_eval_ddp.py / real_eval_reduce.py):
#   1. GPU, ON the critical path but DDP-SHARDED: every rank infers its own
#      ids[rank::world_size] slice with the LIVE model. No checkpoint reload, no
#      second CUDA context, no collectives added to the loop. 24 subjects on 4
#      GPUs = 6 forwards per rank. Labels are cropped to the foreground box and
#      spooled to disk as uint8.
#   2. CPU, OFF the critical path: rank 0 launches a detached, CUDA-free, nice'd
#      reducer that runs the distance transforms in a multiprocessing pool while
#      the next epoch trains. Results land in <logdir>/real_eval/epoch_NNNNN/
#      (per_class.csv + summary.json), get appended to real_eval/history.csv,
#      and are logged to the live wandb run by the callback on a later epoch.
#
# --- what the `valid` loader actually holds -----------------------------------
# WITHOUT this block, curriculum_training falls back to its legacy path:
# MongoheadDataset(range(32)) against the TRAINING db -- i.e. validation on
# synthetic samples drawn from the same wirehead stream as training. Every
# number it produces is in-distribution by construction, so `macro_dice/valid`
# measures how well the model fits the simulator, and the CheckpointCallback
# (metric_key=macro_dice, loader_key=valid, minimize=False) selects
# model.best.pth on that. Best-model selection is then meaningless for real
# scans, which is the only thing this model is for.
#
# Pointing it at real MindfulTensors/MRN makes both meaningful at once: the
# reported metric and the checkpoint chosen by it.
#
# labelfield is labelfused104, NOT label104. The model is now trained against
# the transplanted target -- labelfused geometry for cerebellum (95-98) and
# subcortex (69-84), label104 for cortex. Scoring against plain label104 would
# grade the model DOWN for exactly the cerebellar and subcortical improvements
# the transplant was built to introduce.
#
# num_subjects <= the generator's SOURCE.HOLDOUT_FIRST in
# config.labelfused104.gentle.yaml (32). Both sides take the LOWEST ids, so
# those subjects are reserved and never synthesized from. If you raise this,
# raise HOLDOUT_FIRST too and refill the wirehead db -- otherwise validation
# silently starts scoring subjects the model was trained on.
validation:
  host: "10.245.12.58"        # MindfulTensors, not the wirehead endpoint
  db: "MindfulTensors"
  collection: "MRN"
  datafield: "T1"
  labelfield: "labelfused104"
  num_subjects: 32
  # OFF on purpose. These metrics are scipy distance transforms and they run
  # SYNCHRONOUSLY inside the valid loop, on the critical path. real_eval below
  # already computes NSD/HD95/ASSD over the same MRN subjects every 3 epochs in
  # a detached, nice'd CPU process that training never waits for -- so turning
  # this on buys nothing and costs epoch time. Leave the valid loader cheap:
  # plain Dice is all the checkpointer needs, and it is what selects
  # model.best.pth.
  surface_metrics: false
  surface_every_n_epochs: 5   # moot while surface_metrics is false
  nsd_tau: 1.0
  spacing: [1.0, 1.0, 1.0]    # conformed 1mm isotropic
  fail_dice: 0.5              # per-subject failure threshold (the tail, not the mean)

# label104 is MRN's native dense-atlas field. NOT what this model predicts any
# more -- see the labelfield note under `validation:` above.
real_eval:
  enabled: True
  # Counted ACROSS restarts (persisted in <logdir>/real_eval/epochs_seen), so
  # this is not defeated by the 4h SLURM slices. Keep it <= epochs-per-job for
  # the first few runs so you actually see it fire: at ~35 min/epoch a 4h job is
  # ~6 epochs, so 3 gives you two rounds per job.
  every_n_epochs: 3
  max_subjects: 24          # truncated down to a multiple of world_size
  collection: "MRN"
  labelfield: "labelfused104"   # was label104 -- see the note above
  datafield: "T1"
  tau: 1.0
  spacing: "1,1,1"
  fail_dice: 0.5
  exclude_classes: ""       # e.g. "16,17": kept per-class, dropped from macro
  num_workers: 2            # PER RANK, non-persistent -- keep small, these hold
  prefetch_factor: 2        # Mongo clients alongside the training loader's 12
  amp: true                 # infer under the training autocast dtype
  jobs: 0                   # reducer pool size; 0 => cores - (num_workers + 2)
  nice: 10                  # reducer yields to the training dataloader
  spool_dir: null           # default <logdir>/real_eval/epoch_NNNNN/spool;
                            # point at node-local scratch if logdir is on NFS
  keep_spool: false
  compress: false           # savez_compressed: ~4x smaller, ~10x slower write
  timeout_s: 1800           # reducer stops waiting for a dead rank

experiment:
  # max_lr = 8 * lr_scale / 256 (single rep -> no 0.8^rep attenuation).
  # lr_scale 0.15 -> max_lr ~= 0.0047 (vs the old run's productive ~0.0026). That
  # peak is hot; with the warmup fix below it now ANNEALS instead of staying
  # pinned, so 0.15 may be fine. If the curve stays noisy/flat, drop to 0.10
  # (~0.0031) -- that isolates "hot LR" from "too-long warmup".
  lr_scale: 0.2
  # CRITICAL for a single long run: pct_start is the fraction of the WHOLE cycle
  # spent warming up. At 0.1 over 150 epochs that's ~75k steps pinned at peak LR
  # (the flat/noisy plateau you saw). 0.02 reaches peak fast, then anneals for
  # the rest -- which is where dice actually climbs. (~15k-step warmup here.)
  pct_start: 0.02
  # Decoupled weight decay. > 0 auto-switches the optimizer Adam->AdamW and
  # applies decay to CONV WEIGHTS ONLY (GroupNorm gamma/beta + biases excluded
  # in get_optimizer). Keeps conv-weight/activation magnitudes down so the
  # exported model stays fp16-safe for WebGPU. Resume loads MODEL WEIGHTS ONLY
  # (no optimizer state), so switching Adam->AdamW on a resumed checkpoint is
  # safe. CLI override: experiment.weight_decay=1e-2
  weight_decay: 1.0e-2
  # Gradient clipping (total norm). Bounds an occasional outlier batch so it
  # can't knock the model into a transient train-dice collapse. A non-finite
  # norm (NaN/Inf) SKIPS the step entirely. bf16 needs no unscale, runs
  # directly. 0 to disable. CLI override: experiment.grad_clip=2.0
  grad_clip: 1.0
  # effective batch = numvolumes * accum_steps = 1 * 8 = 8, memory-neutral
  # (does NOT raise it/s or power -- just smooths the gradient / lets the LR
  # run hotter). Was silently 1 here despite the header always having said 8.
  accum_steps: 8
  maxreps: 1                     # single long run (was 10 reps of LR thrash)
  cubesizes_code: |
    [256] * maxreps
  numcubes_code: |
    [1] * maxreps
  numvolumes_code: |
    [1] * maxreps
  weights_code: |
    [1] * maxreps
  databases_code: |
    ["wirehead_mrn_gentle"] * maxreps
  collections_code: |
    ["read"] * maxreps
  dbfields_code: |
    [("data", "label")] * maxreps
  epochs_code: |
    [40] * maxreps   # warm-start refinement, NOT a climb from the floor.
                     # 150 is the from-scratch number. This run resumes from
                     # synth104_..._fromreal_fused, which is already strong on
                     # adults; the target layout did not change (still the same
                     # 104 DK classes), so the whole network transfers and only
                     # the input distribution moved -- CSF at id 108, the pial
                     # rind, wider noise, low-contrast ties. That needs one
                     # warmup+anneal. pct_start is a FRACTION of the cycle, so
                     # the schedule stays correctly shaped at any length.
                     # epochs is the only real wall-clock lever (compute-bound:
                     # time ~= epochs x ~4800 volumes).
  prefetches_code: |
    [24] * maxreps
  attenuates_code: |
    [0.8] * maxreps
